<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - InnKeeper</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/vars.css">
    <link rel="stylesheet" href="../css/public.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/index.css">
</head>

<body class="admin-mode">

    <div class="admin-layout">
        <!-- SIDEBAR -->
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="admin-logo">
                <span>InnKeeper</span>
            </div>

            <nav class="admin-nav">
                <a href="index.html" class="admin-nav-link">
                    <span>Dashboard</span>
                </a>
                <a href="reservations.html" class="admin-nav-link">
                    <span>Reservations</span>
                </a>
                <a href="calendar.html" class="admin-nav-link active">
                    <span>Calendar</span>
                </a>
                <a href="rooms.html" class="admin-nav-link">
                    <span>Rooms</span>
                </a>
                <a href="guests.html" class="admin-nav-link">
                    <span>Guests</span>
                </a>
                <a href="settings.html" class="admin-nav-link">
                    <span>Settings</span>
                </a>
            </nav>

            <div class="user-profile">
                <div class="avatar" style="width:32px;height:32px;background:var(--color-secondary);border-radius:50%;">
                </div>
                <div class="user-info">
                    <div style="font-size:0.8rem;font-weight:600;">Admin User</div>
                    <div style="font-size:0.7rem;opacity:0.7;">Manager</div>
                </div>
                <a href="../index.html"
                    style="margin-left:auto; font-size:0.75rem; color:var(--color-secondary); opacity:0.8;">Exit</a>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="admin-main">
            <header class="admin-header">
                <h2>Availability Calendar</h2>
                <div class="actions">
                    <button class="btn btn-secondary btn-sm" id="admin-menu-toggle">Menu</button>
                    <div style="display: flex; gap: 5px;">
                        <button class="btn btn-secondary btn-sm">&lt;</button>
                        <button class="btn btn-secondary btn-sm">January 2026</button>
                        <button class="btn btn-secondary btn-sm">&gt;</button>
                    </div>
                </div>
            </header>

            <div class="container" style="padding: 0; overflow-x: auto;">
                <div
                    style="background: white; border-radius: var(--radius-md); border: 1px solid rgba(0,0,0,0.1); padding: 1rem; min-width: 800px;">
                    <!-- Calendar Grid Mockup -->
                    <div
                        style="display: grid; grid-template-columns: 150px repeat(7, 1fr); gap: 1px; background: #e0e0e0; border: 1px solid #e0e0e0;">
                        <!-- Header Row -->
                        <div style="background: #f5f5f5; padding: 10px; font-weight: bold;">Room</div>
                        <div style="background: #f5f5f5; padding: 10px; text-align: center;">Mon 26</div>
                        <div style="background: #f5f5f5; padding: 10px; text-align: center;">Tue 27</div>
                        <div style="background: #f5f5f5; padding: 10px; text-align: center;">Wed 28</div>
                        <div style="background: #f5f5f5; padding: 10px; text-align: center;">Thu 29</div>
                        <div style="background: #f5f5f5; padding: 10px; text-align: center;">Fri 30</div>
                        <div style="background: #f5f5f5; padding: 10px; text-align: center;">Sat 31</div>
                        <div style="background: #f5f5f5; padding: 10px; text-align: center;">Sun 01</div>

                        <!-- Room 101 -->
                        <div style="background: white; padding: 10px;">Forest Suite (101)</div>
                        <div
                            style="background: #e6f4ea; padding: 10px; grid-column: span 3; text-align: center; color: #1e8e3e; font-size: 0.8rem; border-radius: 4px; margin: 2px;">
                            Smith</div>
                        <div style="background: white; padding: 10px;"></div>
                        <div style="background: white; padding: 10px;"></div>
                        <div style="background: white; padding: 10px;"></div>
                        <div style="background: white; padding: 10px;"></div>

                        <!-- Room 104 -->
                        <div style="background: white; padding: 10px;">Sand Loft (104)</div>
                        <div style="background: white; padding: 10px;"></div>
                        <div
                            style="background: #fff8e1; padding: 10px; grid-column: span 2; text-align: center; color: #f9a825; font-size: 0.8rem; border-radius: 4px; margin: 2px;">
                            Johnson (Pending)</div>
                        <div style="background: white; padding: 10px;"></div>
                        <div style="background: white; padding: 10px;"></div>
                        <div style="background: white; padding: 10px;"></div>
                        <div style="background: white; padding: 10px;"></div>

                        <!-- Room 201 -->
                        <div style="background: white; padding: 10px;">Stone Cottage (201)</div>
                        <div style="background: white; padding: 10px;"></div>
                        <div style="background: white; padding: 10px;"></div>
                        <div style="background: white; padding: 10px;"></div>
                        <div style="background: white; padding: 10px;"></div>
                        <div style="background: white; padding: 10px;"></div>
                        <div style="background: white; padding: 10px;"></div>
                        <div style="background: white; padding: 10px;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/script.js"></script>
</body>

</html>
