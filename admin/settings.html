<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - InnKeeper</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/vars.css">
    <link rel="stylesheet" href="../css/public.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/index.css">
</head>

<body class="admin-mode">

    <div class="admin-layout">
        <!-- SIDEBAR -->
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="admin-logo">
                <span>InnKeeper</span>
            </div>

            <nav class="admin-nav">
                <a href="index.html" class="admin-nav-link">
                    <span>Dashboard</span>
                </a>
                <a href="reservations.html" class="admin-nav-link">
                    <span>Reservations</span>
                </a>
                <a href="calendar.html" class="admin-nav-link">
                    <span>Calendar</span>
                </a>
                <a href="rooms.html" class="admin-nav-link">
                    <span>Rooms</span>
                </a>
                <a href="guests.html" class="admin-nav-link">
                    <span>Guests</span>
                </a>
                <a href="settings.html" class="admin-nav-link active">
                    <span>Settings</span>
                </a>
            </nav>

            <div class="user-profile">
                <div class="avatar" style="width:32px;height:32px;background:var(--color-secondary);border-radius:50%;">
                </div>
                <div class="user-info">
                    <div style="font-size:0.8rem;font-weight:600;">Admin User</div>
                    <div style="font-size:0.7rem;opacity:0.7;">Manager</div>
                </div>
                <a href="../index.html"
                    style="margin-left:auto; font-size:0.75rem; color:var(--color-secondary); opacity:0.8;">Exit</a>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="admin-main">
            <header class="admin-header">
                <h2>Settings</h2>
                <div class="actions">
                    <button class="btn btn-secondary btn-sm" id="admin-menu-toggle">Menu</button>
                    <button class="btn btn-primary btn-sm">Save Changes</button>
                </div>
            </header>

            <div class="dashboard-grid" style="grid-template-columns: 1fr; max-width: 800px;">
                <div class="stat-card">
                    <h3 style="margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">General
                        Settings</h3>
                    <div style="display: grid; gap: 1rem;">
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Site Name</label>
                            <input type="text" value="Bed & Breakfast Inn"
                                style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Contact
                                Email</label>
                            <input type="email" value="info@bnb.com"
                                style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                    </div>
                </div>

                <div class="stat-card">
                    <h3 style="margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">Account
                        Security</h3>
                    <div style="display: grid; gap: 1rem;">
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Current
                                Password</label>
                            <input type="password"
                                style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">New Password</label>
                            <input type="password"
                                style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div>
                            <button class="btn btn-secondary btn-sm">Update Password</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/script.js"></script>
</body>

</html>
