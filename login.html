<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bed & Breakfast Inn</title>

    <!-- CSS Links -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/vars.css">
    <link rel="stylesheet" href="css/public.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<body class="public-mode">

    <!-- HEADER -->
    <header class="public-header">
        <div class="container public-header-content">
            <a href="index.html" class="brand-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z" />
                </svg>
                Bed & Breakfast
            </a>
            <div class="header-actions">
                <a href="index.html" class="btn btn-secondary btn-sm">Back to Home</a>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="public-main" style="display:flex; align-items:center; justify-content:center; min-height:80vh;">
        <div class="container" style="max-width: 480px; width:100%;">
            <div class="auth-card"
                style="background: var(--color-bg-body); padding: var(--spacing-lg); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); text-align: center; border: 1px solid rgba(47,79,79,0.1);">
                <h1 style="font-family: var(--font-family-serif); margin-bottom: var(--spacing-md);">Welcome Back</h1>
                <form style="display: flex; flex-direction: column; gap: var(--spacing-md); text-align: left;"
                    action="admin/index.html">
                    <div>
                        <label
                            style="display:block; margin-bottom:var(--spacing-xs); font-size:var(--font-size-sm); font-weight:500;">Email
                            Address</label>
                        <input type="email" placeholder="you@example.com" value="admin@inn.com"
                            style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: var(--radius-sm); background: var(--color-bg-body); color: var(--color-text-body);">
                    </div>
                    <div>
                        <label
                            style="display:block; margin-bottom:var(--spacing-xs); font-size:var(--font-size-sm); font-weight:500;">Password</label>
                        <input type="password" placeholder="••••••••" value="password"
                            style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: var(--radius-sm); background: var(--color-bg-body); color: var(--color-text-body);">
                    </div>
                    <button type="submit" class="btn btn-primary" style="margin-top: var(--spacing-sm);">Login</button>
                </form>
                <p style="margin-top: var(--spacing-md); font-size: var(--font-size-sm); opacity: 0.8;">
                    Don't have an account? <a href="signup.html"
                        style="color:var(--color-primary);font-weight:600;">Sign up</a>
                </p>
            </div>
        </div>
    </main>

    <!-- JS -->
    <script src="js/script.js"></script>
</body>

</html>
