<svg width="180" height="50" viewBox="0 0 180 50" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Sector Gradient -->
    <linearGradient id="sectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F4F4F"/>
      <stop offset="100%" stop-color="#3A6161"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="50" rx="10" fill="#ffffff" stroke="#2F4F4F"/>

  <!-- BED -->
  <g transform="translate(10,14)">
    <rect x="0" y="0" width="6" height="20" rx="2" fill="#2F5D50"/>
    <rect x="6" y="10" width="38" height="10" rx="4" fill="#2F5D50"/>
    <rect x="12" y="6" width="14" height="8" rx="4" fill="#F4F7F5"/>
    <rect x="6" y="20" width="4" height="4" fill="#2F5D50"/>
    <rect x="40" y="20" width="4" height="4" fill="#2F5D50"/>
  </g>

  <!-- PLATE WITH BREAD SECTOR -->
  <g transform="translate(55,13)">
    <circle cx="12" cy="12" r="12" fill="#ffffff" stroke="#2F5D50" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="3" fill="#F4B942"/>
    <path d="M12 12 L12 0 A12 12 0 0 1 22 5 Z" fill="#F4C27A" stroke="#D9A441" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="85" y="26"
        font-family="Poppins, Arial, sans-serif"
        font-size="16"
        font-weight="600"
        fill="#2F4F4F">Bed &amp;</text>

  <!-- Subtitle -->
  <text x="85" y="40"
        font-family="Poppins, Arial, sans-serif"
        font-size="13"
        font-weight="500"
        fill="#3A6161">Breakfast</text>

</svg>